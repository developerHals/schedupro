name = "schedupro-learnertrack-sync"
main = "src/index.js"
compatibility_date = "2024-07-28"

# Runs every 30 minutes. Adjust as needed.
[triggers]
crons = ["*/30 * * * *"]

# Same D1 database as the Pages app (functions/), so the sync writes go to
# the exact tables the app reads from.
[[d1_databases]]
binding = "schedupro_db"
database_name = "schedupro-db"
database_id = "beaa4b4f-d568-4ff3-af9e-dd6dfe1e4e5e"
